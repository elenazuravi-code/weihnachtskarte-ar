<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>AR-Kartentest</title><script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:system-ui}a-scene{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;display:block!important}a-scene canvas{width:100%!important;height:100%!important;display:block!important}video{object-fit:cover!important} #status{position:fixed;z-index:100;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;background:#171717;color:white;padding:12px;border-radius:8px;text-align:center;font-size:15px}</style></head><body><div id="status">Lade AR... Bitte warten.</div><a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes;" color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded style="width:100vw;height:100dvh;"><a-camera position="0 0 0" look-controls="enabled: false"></a-camera><a-entity id="target" mindar-image-target="targetIndex: 0"><a-plane color="#00FF44" opacity="0.85" width="0.28" height="0.28" position="0 0 0.05" material="shader: flat; side: double"></a-plane></a-entity></a-scene><script>const status=document.getElementById('status');const scene=document.querySelector('a-scene');scene.addEventListener('arReady',()=>status.textContent='Kamera bereit – Karte vollständig ins Bild halten');scene.addEventListener('arError',()=>status.textContent='AR-Fehler: Kamera oder Tracking konnte nicht gestartet werden');const target=document.getElementById('target');target.addEventListener('targetFound',()=>status.textContent='BILD ERKANNT ✓ – grünes Quadrat sichtbar');target.addEventListener('targetLost',()=>status.textContent='Bild verloren – Kamera ruhig auf die Karte richten');</script></body></html>
