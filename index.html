<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Weihnachtskarte – AR-Test</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
body{margin:0;overflow:hidden;font-family:system-ui,sans-serif}
#hint{position:fixed;z-index:5;top:12px;left:12px;right:12px;padding:12px 16px;border-radius:12px;background:rgba(0,0,0,.72);color:white;text-align:center;font-size:14px;pointer-events:none}
</style>
</head>
<body>
<div id="hint">Kamera erlauben und auf die gedruckte Illustration richten. Wenn sie erkannt wird, erscheint ein grüner Stern.</div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>
<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
<a-entity mindar-image-target="targetIndex: 0">
<a-text value="★" align="center" color="#00FF66" width="1.4" position="0 0 0.02" side="double"></a-text>
</a-entity>
</a-scene>
</body>
</html>
