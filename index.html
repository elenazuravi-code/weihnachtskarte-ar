<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>AR Kamera Diagnose</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151515;font-family:system-ui,sans-serif}
#status{position:fixed;z-index:9999;top:calc(env(safe-area-inset-top) + 8px);left:12px;right:12px;background:#181818e8;color:white;border-radius:9px;padding:10px;font-size:14px;text-align:center;pointer-events:none}
#debug{position:fixed;z-index:9999;bottom:calc(env(safe-area-inset-bottom) + 12px);left:12px;right:12px;background:#181818d9;color:white;padding:8px;font-size:11px;border-radius:8px;pointer-events:none}
</style></head><body>
<div id="status">AR startet …</div><div id="debug">Kameratest wird vorbereitet …</div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: no; uiError: yes" color-space="sRGB" renderer="colorManagement: true; alpha: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>
<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
<a-entity id="target" mindar-image-target="targetIndex: 0"><a-plane color="#00ff44" width="0.28" height="0.28" position="0 0 0.05" material="shader: flat; side: double"></a-plane></a-entity>
</a-scene>
<script>
const status=document.getElementById('status'),debug=document.getElementById('debug'),scene=document.querySelector('a-scene'),target=document.getElementById('target');
scene.addEventListener('arReady',()=>status.textContent='Kamera bereit – Illustration anvisieren');
scene.addEventListener('arError',()=>status.textContent='AR-Fehler – Kamera konnte nicht gestartet werden');
target.addEventListener('targetFound',()=>status.textContent='BILD ERKANNT ✓');
target.addEventListener('targetLost',()=>status.textContent='Bild nicht erkannt');
function inspect(){const v=document.querySelector('video'),c=scene.querySelector('canvas'); if(!v){debug.textContent='Videoelement noch nicht vorhanden';return;} const r=v.getBoundingClientRect(),s=getComputedStyle(v); debug.textContent=`Video ${v.videoWidth}×${v.videoHeight} | ${Math.round(r.width)}×${Math.round(r.height)} | play:${!v.paused} | ready:${v.readyState} | visible:${s.visibility} | opacity:${s.opacity} | canvas:${c?getComputedStyle(c).backgroundColor:'fehlt'}`;}
setInterval(inspect,1500);inspect();
</script></body></html>
